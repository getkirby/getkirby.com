# Runs the tests and checks the code style

name: CI
on:
  # long-lived branches only, so a pull request doesn't run twice
  push:
    branches: [main, feat/v6]
  pull_request:

# a new push cancels the runs it supersedes
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# a job that needs more asks for it
permissions:
  contents: read

jobs:
  tests:
    name: Tests

    runs-on: &runner ubuntu-24.04
    timeout-minutes: &timeout 10

    steps:
      - &checkout
        name: Checkout
        uses: getkirby/actions/checkout@07e658b7eb1254cafc0baf94a2d241e810658176 # 0.3.0

      # vendor/ and kirby/ are committed, so there is nothing to install
      - &php
        name: Setup PHP
        uses: getkirby/actions/php@07e658b7eb1254cafc0baf94a2d241e810658176 # 0.3.0
        with:
          version: "8.4"
          extensions: mbstring, intl
          dependencies: none

      - name: Run PHP unit tests
        uses: getkirby/actions/phpunit@07e658b7eb1254cafc0baf94a2d241e810658176 # 0.3.0

  style:
    name: Code style

    runs-on: *runner
    timeout-minutes: *timeout
    permissions:
      contents: read
      # posts the fixes as suggestions on pull requests
      pull-requests: write

    steps:
      - *checkout
      - *php

      - name: Check PHP code style
        uses: getkirby/actions/php-cs@07e658b7eb1254cafc0baf94a2d241e810658176 # 0.3.0
        with:
          suggestions: true
