# Updates the Algolia search index on all content changes

name: Update Algolia index
on:
  workflow_dispatch:
  repository_dispatch:
    types: [update-algolia]
  push:
    branches:
      - main
    paths:
      - .github/workflows/algolia.yml
      - content/**.txt
      - site/config/search.php
      - site/models/**
      - site/plugins/**
      - scripts/algolia-index

# a new run cancels the one it supersedes
concurrency:
  group: algolia
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  algolia:
    name: Update Algolia index

    runs-on: ubuntu-24.04
    # usually takes about two minutes
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: getkirby/actions/checkout@07e658b7eb1254cafc0baf94a2d241e810658176 # 0.3.0

      # vendor/ and kirby/ are committed, so there is nothing to install
      - name: Setup PHP
        uses: getkirby/actions/php@07e658b7eb1254cafc0baf94a2d241e810658176 # 0.3.0
        with:
          version: "8.4"
          extensions: mbstring, intl
          ini: memory_limit=-1
          dependencies: none

      - name: Update the Algolia index
        run: scripts/algolia-index
        env:
          ALGOLIA_KEY: ${{ secrets.ALGOLIA_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
